<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ 'assets/logo-small.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ 'assets/logo-small.png' | relative_url }}">

    {% seo %}

    <style>
      :root {
        --primary-color: #aa0000; /* Group's red color */
        --secondary-color: #333;
        --bg-light: #f8f9fa;
      }
      body {
        font-family: 'Inter', sans-serif;
        color: var(--secondary-color);
        line-height: 1.6;
      }
      h1, h2, h3 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
      }
      .navbar-brand {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: var(--primary-color) !important;
      }
      .logo-img {
        height: 60px;
        margin-bottom: 1rem;
      }
      .section-title {
        border-bottom: 2px solid var(--primary-color);
        display: inline-block;
        margin-bottom: 2rem;
        padding-bottom: 0.5rem;
      }
      .card {
        border: none;
        transition: transform 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(0,0,0,0.1);
      }
      .tag {
        font-size: 0.8rem;
        padding: 0.2rem 0.5rem;
        background-color: var(--bg-light);
        border-radius: 4px;
        margin-right: 0.5rem;
        color: #666;
      }
      .footer {
        background-color: var(--bg-light);
        padding: 3rem 0;
        margin-top: 5rem;
      }
      .profile-img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
      }
      .profile-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile-img i {
        font-size: 50px;
        color: #ccc;
      }
      a {
        color: var(--primary-color);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .btn-primary {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
      }
      .btn-primary:hover {
        background-color: #880000;
        border-color: #880000;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">
          Formal Security
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
            <li class="nav-item"><a class="nav-link" href="#publications">Publications</a></li>
            <li class="nav-item"><a class="nav-link" href="#team">Team</a></li>
            <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      {{ content }}
    </main>

    <footer class="footer mt-auto">
      <div class="container text-center text-muted">
        <div class="row">
          <div class="col-md-12">
            <img src="assets/logo-small.png" height="30" class="mb-3">
            <p>Formal Security for Web Technologies @ INESC-ID Lisboa</p>
            <div class="social-links mb-3">
              <a href="https://github.com/formalsec" class="mx-2 text-muted"><i class="fab fa-github fa-lg"></i></a>
            </div>
            <small>&copy; {{ site.time | date: "%Y" }} Formal Security Group. Built with Jekyll.</small>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
